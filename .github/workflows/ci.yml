name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          # Runtime is stdlib-only; the [test] extra pins the deps the suite imports.
          pip install -e ".[test]"

      - name: Run test suite
        # pytest config in pyproject sets testpaths=[tests] and pythonpath=[src].
        # A fresh checkout contains only tracked files, so untracked local-only
        # tests (e.g. the separate Lumin genesis suite) are not collected here.
        run: pytest -q
