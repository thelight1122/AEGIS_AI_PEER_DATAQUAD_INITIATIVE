[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-peer-runtime"
version = "0.1.0"
description = "Isolated local runtime for four AEGIS AI Peer DataQuads"
requires-python = ">=3.10"
dependencies = []

# The runtime itself is stdlib-only. These are needed only to run the test
# suite (numpy/jsonschema/referencing/packaging are imported by tracked tests).
[project.optional-dependencies]
test = [
    "pytest",
    "jsonschema",
    "referencing",
    "numpy",
    "packaging",
]

[project.scripts]
aegis-peer-runtime = "aegis_peer_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
