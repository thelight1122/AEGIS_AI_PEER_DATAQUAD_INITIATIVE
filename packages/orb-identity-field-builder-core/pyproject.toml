[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orb-identity-field-builder-core"
version = "0.1.0"
description = "Identity Field Builder Orb: local Phase 1 builder for bounded IdentityImagePacket with negative-space policy."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orb_identity_field_builder_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
