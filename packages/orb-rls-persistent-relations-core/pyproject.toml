[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orb-rls-persistent-relations-core"
version = "1.0.0"
description = "The rls-persistent-relations-core Orb: recursive-learning-session retrieval/writeback, extracted from AEGIS-CYBERPEER-CORE's monolith to attach to any Pod via aegis-pod-sdk protocols instead of concrete Pod-core classes."
requires-python = ">=3.11"
dependencies = [
    "aegis-pod-sdk>=0.1,<0.2",
    "pydantic>=2",
    "aiofiles>=23",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/orb_rls_persistent_relations_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
