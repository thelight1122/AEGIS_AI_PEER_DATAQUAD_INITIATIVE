[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orb-memorysearch-record-grounding-core"
version = "0.1.0"
description = "MemorySearch record-grounding Orb: deterministic record-claim classification, local DataQuad record scoring, and runtime-authored provenance packets."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orb_memorysearch_record_grounding_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
